name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  release-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install release verification tools
        run: python -m pip install -e ".[dev]"
      - name: Verify package and runtime versions
        run: python scripts/verify_release.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Validate bundled workflow catalog
        run: >-
          python src/codev_workflow/bundle/scripts/validate-development-workflow.py
          --repo src/codev_workflow/bundle
      - name: Self-test behavioral evaluator
        run: >-
          python src/codev_workflow/bundle/scripts/evaluate-development-workflow.py
          --repo src/codev_workflow/bundle
          --self-test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-test built wheel
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --no-deps dist/*.whl
          .release-venv/bin/codev --version
          .release-venv/bin/python -c "from importlib import resources; root = resources.files('codev_workflow').joinpath('bundle/.codex/agents'); assert sorted(item.name for item in root.iterdir()) == ['builder.toml', 'orchestrator.toml', 'reviewer.toml']"
      - name: Upload tested distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  live-eval:
    # Scheduled (not on every PR): runs a review-change skill performance
    # snapshot against a live OpenCode actor -- every seeded-defect fixture,
    # with the skill installed and without it, repeated -- and reports the
    # with/without delta per category, per docs/adr/0001-work-lifecycle-invariant.md.
    # Also runs on release tags so prepare-release can gate on it, same as
    # release-integrity/test/quality.
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CoDev
        run: python -m pip install -e .
      - name: Check OpenCode credentials are configured
        id: creds
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENCODE_API_KEY is not set as a repository secret." \
              "Skipping the live seeded-defect recall suite for this run rather" \
              "than failing the pipeline on it. See" \
              "docs/features/skill-eval/README.md and" \
              "docs/adr/0001-work-lifecycle-invariant.md. This job still needs" \
              "this project's actual OpenCode CI installation and headless-auth" \
              "steps wired in below before it can measure anything."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install and authenticate OpenCode
        if: steps.creds.outputs.configured == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          echo "::error::OPENCODE_API_KEY is set, but this step's actual install" \
            "and headless-auth commands are still a placeholder. Replace this" \
            "step with this project's real OpenCode CI installation and" \
            "authentication steps before relying on this job's result."
          exit 1
      - name: Run the review-change skill performance snapshot
        if: steps.creds.outputs.configured == 'true'
        run: >-
          codev eval snapshot run review-change
          --target .
          --output "${{ runner.temp }}/seeded-defect-results"
      - name: Upload evidence
        if: steps.creds.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seeded-defect-eval-results
          path: ${{ runner.temp }}/seeded-defect-results
          if-no-files-found: warn

  prepare-release:
    needs: [release-integrity, test, quality, live-eval]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify release tag and package versions
        run: >-
          python scripts/verify_release.py
          --tag "$GITHUB_REF_NAME"
          --metadata-only
      - name: Download distributions tested by CI
        uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist
      - name: Recheck distribution metadata
        run: |
          python -m pip install --disable-pip-version-check twine
          python -m twine check dist/*
      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  attest:
    needs: prepare-release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

  publish:
    needs: attest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/open-codev-workflow
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
