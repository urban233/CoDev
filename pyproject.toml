[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-codev-workflow"
version = "0.2.1"
description = "Human-guided AI software delivery for real repositories."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{ name = "Martin Urban" }]
keywords = ["ai", "developer-tools", "software-delivery", "antigravity", "codex", "junie", "opencode"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pre-commit>=4.6.1",
]

[project.urls]
Homepage = "https://github.com/urban233/CoDev"
Repository = "https://github.com/urban233/CoDev"
Issues = "https://github.com/urban233/CoDev/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "mypy>=1.15",
  "ruff>=0.11",
  "twine>=6.1",
]

[project.scripts]
codev = "codev_workflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codev_workflow = [
  "bundle/AGENTS.md",
  "bundle/.codev/for-ai/*.md",
  "bundle/.agents/skills/*/SKILL.md",
  "bundle/.agents/skills/*/agents/*.yaml",
  "bundle/.agents/skills/*/assets/*",
  "bundle/.agents/skills/*/references/*",
  "bundle/.agents/skills/*/scripts/*",
  "bundle/.agents/agents/*.md",
  "bundle/.agents/agents/*.md.template",
  "bundle/.codex/agents/*.toml",
  "bundle/.codex/agents/*.toml.template",
  "bundle/.opencode/agents/*.md",
  "bundle/.opencode/agents/*.md.template",
  "bundle/.junie/agents/*.md",
  "bundle/.junie/agents/*.md.template",
  "bundle/.junie/commands/*.md",
  "bundle/docs/*.md",
  "bundle/docs/codev/onboarding/*.md",
  "bundle/docs/handbooks/*.md",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["src/codev_workflow/bundle", ".codev/fixtures/*/repository"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/codev_workflow", "tests"]
exclude = "src/codev_workflow/bundle/"
